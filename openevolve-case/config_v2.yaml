# Bounded PDSA diversity probe after a repeated all-255 local batch.
max_iterations: 8
checkpoint_interval: 1
random_seed: null
language: json
file_suffix: .json
diff_based_evolution: false
max_code_length: 512
early_stopping_metric: combined_score

llm:
  provider: openai
  api_base: http://127.0.0.1:11434/v1
  api_key: ollama
  models:
    - name: qwen3.5:2b-q4_K_M
      provider: openai
      api_base: http://127.0.0.1:11434/v1
      api_key: ollama
      reasoning_effort: none
      weight: 1.0
      max_tokens: 256
      timeout: 120
      retries: 0
  temperature: 0.7
  max_tokens: 256
  timeout: 120
  retries: 0

prompt:
  template_dir: prompt_v2
  use_template_stochasticity: false
  num_top_programs: 0
  num_diverse_programs: 0
  include_artifacts: false
  system_message: |-
    You optimize a compact JSON genotype for the P-384 scalar-order n-2
    addition chain. The trusted evaluator expands the data into a certificate.
    Return only a complete valid JSON object; never return reasoning, Python,
    shell commands, Markdown, or SEARCH/REPLACE markers.

database:
  population_size: 16
  archive_size: 8
  num_islands: 1
  random_seed: 20260929
  embedding_model: null
  similarity_threshold: 0.0
  log_prompts: true

evaluator:
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false
  max_retries: 0
  timeout: 15
  enable_artifacts: false

evolution_trace:
  enabled: true
  format: jsonl
  include_code: true
  include_prompts: true
